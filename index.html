<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleBuff - 祈禱計時與經驗值效率計算</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-cyan-500 selection:text-slate-950">

    <!-- 頂部標題 -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
            ✨ MapleBuff 練功小幫手 ✨
        </h1>
        <p class="text-xs text-slate-400 mt-1">祈禱 118s 精準計時 + 經驗值碼錶與效率分析</p>
    </header>

    <main class="w-full max-w-md space-y-4">
        
        <!-- 1. 祈禱計時卡片 -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-400">🕒 祈禱 118s 計時器</span>
                <span id="statusBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400">尚未開始</span>
            </div>

            <div id="displayCard" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
                <div id="timeDisplay" class="text-5xl font-mono font-black text-cyan-400 tracking-tight">01:58</div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="startResetBtn" class="col-span-2 py-2.5 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm transition">
                    🚀 開始 / 重新計時 (118s)
                </button>
                <button id="pauseBtn" class="py-1.5 px-3 rounded-lg bg-slate-800 text-slate-300 font-bold text-xs">⏸️ 暫停</button>
                <button id="stopBtn" class="py-1.5 px-3 rounded-lg bg-slate-800 text-rose-400 font-bold text-xs">⏹️ 重置</button>
            </div>

            <!-- 音效與警報設定摺疊 -->
            <details class="text-xs space-y-2 pt-1 border-t border-slate-800/80">
                <summary class="cursor-pointer text-slate-400 font-semibold hover:text-slate-200">⚙️ 音效與警報設定</summary>
                
                <div class="space-y-2 pt-2">
                    <div class="flex justify-between">
                        <span class="text-slate-400">提醒時間</span>
                        <span class="text-cyan-400 font-mono font-bold">剩 <span id="alertTimeVal">15</span> 秒</span>
                    </div>
                    <input type="range" id="alertSlider" min="5" max="50" value="15" class="w-full accent-cyan-500">

                    <div class="flex justify-between items-center pt-1">
                        <span class="text-slate-400">自訂音效</span>
                        <span id="audioStatus" class="text-[10px] text-slate-500">預設提示音</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="file" id="audioFile" accept="audio/*" class="w-full text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-cyan-500 file:text-slate-950">
                        <button id="testAudioBtn" class="px-2 py-1 bg-slate-800 text-cyan-400 rounded-lg text-[11px] shrink-0">🔊 試聽</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400"><span>音量</span><span id="audioVolVal">50</span>%</div>
                            <input type="range" id="audioVolSlider" min="5" max="100" value="50" class="w-full accent-emerald-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400"><span>長度</span><span id="audioDurVal">2.0</span>s</div>
                            <input type="range" id="audioDurSlider" min="0.5" max="10.0" step="0.5" value="2.0" class="w-full accent-emerald-500">
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-1">
                        <span class="text-slate-400">🔁 自動循環模式</span>
                        <input type="checkbox" id="autoLoopToggle" checked class="accent-cyan-500">
                    </div>
                </div>
            </details>
        </section>

        <!-- 2. 📈 手動經驗值效率計算卡片 (附即時碼錶) -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-400">📈 經驗值效率計算與即時碼錶</span>
                <span id="expStateBadge" class="text-[10px] text-cyan-400 font-mono">準備中 (步驟 1)</span>
            </div>

            <!-- 輸入控制面板 -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-3 text-xs">
                
                <!-- 步驟 1: 起始經驗值 -->
                <div id="step1Container" class="space-y-1.5">
                    <label class="block text-slate-300 font-semibold">1️⃣ 輸入練功「開始」時的經驗值：</label>
                    <div class="flex gap-2">
                        <input type="number" id="startExpInput" placeholder="例如: 12345678" class="w-full bg-slate-900 border border-slate-700 focus:border-cyan-400 rounded-lg px-3 py-2 text-slate-200 outline-none font-mono">
                        <button id="startExpBtn" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg transition shrink-0">
                            開始計時 🚀
                        </button>
                    </div>
                </div>

                <!-- 步驟 2: 結束經驗值 (預設隱藏) -->
                <div id="step2Container" class="space-y-1.5 hidden">
                    <label class="block text-slate-300 font-semibold">2️⃣ 輸入練功「結束」時的經驗值：</label>
                    <div class="flex gap-2">
                        <input type="number" id="endExpInput" placeholder="例如: 12456789" class="w-full bg-slate-900 border border-slate-700 focus:border-cyan-400 rounded-lg px-3 py-2 text-slate-200 outline-none font-mono">
                        <button id="endExpBtn" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg transition shrink-0">
                            結束並結算 🏁
                        </button>
                    </div>
                </div>

            </div>

            <!-- 計算與即時碼錶顯示面板 -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2.5 text-xs">
                
                <!-- ⏱️ 即時碼錶顯示區 -->
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-2.5 flex justify-between items-center">
                    <span class="text-slate-300 font-semibold">⏱️ 練功碼錶計時：</span>
                    <span id="liveStopwatch" class="font-mono font-bold text-base text-cyan-400">00:00:00</span>
                </div>

                <div class="grid grid-cols-2 gap-2 text-slate-400 pt-1">
                    <div>起始經驗: <span id="expStart" class="text-slate-200 font-mono font-bold">-</span></div>
                    <div>結束經驗: <span id="expEnd" class="text-slate-200 font-mono font-bold">-</span></div>
                    <div>實際耗時: <span id="expDuration" class="text-slate-200 font-mono font-bold">-</span></div>
                    <div>獲得 EXP: <span id="expGained" class="text-emerald-400 font-mono font-bold">-</span></div>
                </div>

                <!-- ⏱️ 10分鐘預估 -->
                <div class="border-t border-slate-800/80 pt-2 flex justify-between items-center">
                    <span class="text-slate-300">⏱️ 預估 10 分鐘獲得：</span>
                    <span id="exp10Min" class="font-mono font-bold text-amber-400">0</span>
                </div>

                <!-- ⏰ 1小時預估 (EXP/h) -->
                <div class="border-t border-slate-800 pt-2 flex justify-between items-center">
                    <span class="font-bold text-slate-200">⏰ 預估 1 小時獲得 (EXP/h)：</span>
                    <span id="expPerHour" class="text-sm font-mono font-black text-cyan-400">0</span>
                </div>
            </div>

            <button id="resetExpBtn" class="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs rounded-lg transition">🔄 重新開始測量</button>
        </section>

    </main>

    <footer class="w-full max-w-md text-center py-2 text-[10px] text-slate-500">
        💡 全新現貨，不用等五十年後的流星雨
    </footer>

    <!-- JS 邏輯 -->
    <script>
        // --- 1. 118s 精準計時器邏輯 ---
        const TOTAL_TIME = 118;
        let targetEndTime = 0;
        let timerId = null;
        let isRunning = false;
        let audioCtx = null;
        let hasAlertedThisCycle = false;
        let customAudioBuffer = null;

        const timeDisplay = document.getElementById('timeDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const displayCard = document.getElementById('displayCard');
        const startResetBtn = document.getElementById('startResetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const alertSlider = document.getElementById('alertSlider');
        const alertTimeVal = document.getElementById('alertTimeVal');
        const audioFile = document.getElementById('audioFile');
        const audioStatus = document.getElementById('audioStatus');
        const testAudioBtn = document.getElementById('testAudioBtn');
        const audioDurSlider
