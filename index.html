<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleBuff - 祈禱計時與經驗值效率分析</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js (前端 OCR 文字辨識庫) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-cyan-500 selection:text-slate-950">

    <!-- 頂部標題 -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
            ✨ MapleBuff 練功小幫手 ✨
        </h1>
        <p class="text-xs text-slate-400 mt-1">祈禱計時 + 經驗值截圖分析 (Ctrl+V / 上傳)</p>
    </header>

    <main class="w-full max-w-md space-y-4">
        
        <!-- 1. 祈禱計時卡片 -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-400">🕒 祈禱 118s 計時器</span>
                <span id="statusBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400">尚未開始</span>
            </div>

            <div id="displayCard" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
                <div id="timeDisplay" class="text-5xl font-mono font-black text-cyan-400 tracking-tight">01:58</div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="startResetBtn" class="col-span-2 py-2.5 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm transition">
                    🚀 開始 / 重新計時 (118s)
                </button>
                <button id="pauseBtn" class="py-1.5 px-3 rounded-lg bg-slate-800 text-slate-300 font-bold text-xs">⏸️ 暫停</button>
                <button id="stopBtn" class="py-1.5 px-3 rounded-lg bg-slate-800 text-rose-400 font-bold text-xs">⏹️ 重置</button>
            </div>

            <!-- 音效與警報設定摺疊 -->
            <details class="text-xs space-y-2 pt-1 border-t border-slate-800/80">
                <summary class="cursor-pointer text-slate-400 font-semibold hover:text-slate-200">⚙️ 音效與警報設定</summary>
                
                <div class="space-y-2 pt-2">
                    <div class="flex justify-between">
                        <span class="text-slate-400">提醒時間</span>
                        <span class="text-cyan-400 font-mono font-bold">剩 <span id="alertTimeVal">15</span> 秒</span>
                    </div>
                    <input type="range" id="alertSlider" min="5" max="50" value="15" class="w-full accent-cyan-500">

                    <div class="flex justify-between items-center pt-1">
                        <span class="text-slate-400">自訂音效</span>
                        <span id="audioStatus" class="text-[10px] text-slate-500">預設提示音</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="file" id="audioFile" accept="audio/*" class="w-full text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-cyan-500 file:text-slate-950">
                        <button id="testAudioBtn" class="px-2 py-1 bg-slate-800 text-cyan-400 rounded-lg text-[11px] shrink-0">🔊 試聽</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400"><span>音量</span><span id="audioVolVal">50</span>%</div>
                            <input type="range" id="audioVolSlider" min="5" max="100" value="50" class="w-full accent-emerald-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400"><span>長度</span><span id="audioDurVal">2.0</span>s</div>
                            <input type="range" id="audioDurSlider" min="0.5" max="10.0" step="0.5" value="2.0" class="w-full accent-emerald-500">
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-1">
                        <span class="text-slate-400">🔁 自動循環模式</span>
                        <input type="checkbox" id="autoLoopToggle" checked class="accent-cyan-500">
                    </div>
                </div>
            </details>
        </section>

        <!-- 2. 📈 經驗值效率計算卡片 -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-400">📈 練功經驗值效率分析</span>
                <span id="ocrStatus" class="text-[10px] text-cyan-400 font-mono">Ready</span>
            </div>

            <!-- 貼上與上傳區域 -->
            <div id="pasteZone" class="border-2 border-dashed border-slate-700 hover:border-cyan-500 rounded-xl p-4 text-center cursor-pointer bg-slate-950/50 transition relative">
                <div id="pasteText" class="text-sm font-bold text-slate-300">
                    📋 點此處按 <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-cyan-400">Ctrl + V</kbd> 貼上截圖<br>
                    <span class="text-xs text-slate-500 font-normal">或點擊選擇檔案上傳</span>
                </div>
                <!-- 隱藏的圖片選擇器 -->
                <input type="file" id="imgUploadInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>

            <!-- 預覽圖 -->
            <div id="imgPreviewContainer" class="hidden flex justify-center">
                <img id="imgPreview" class="max-h-24 rounded border border-slate-800">
            </div>

            <!-- 計算結果面板 -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2 text-slate-400">
                    <div>起始經驗: <span id="expStart" class="text-slate-200 font-mono font-bold">-</span></div>
                    <div>結束經驗: <span id="expEnd" class="text-slate-200 font-mono font-bold">-</span></div>
                    <div>測試時間: <span id="expDuration" class="text-slate-200 font-mono font-bold">-</span></div>
                    <div>總獲得 EXP: <span id="expGained" class="text-emerald-400 font-mono font-bold">-</span></div>
                </div>

                <div class="border-t border-slate-800 pt-2 flex justify-between items-center">
                    <span class="font-bold text-slate-300">⚡ 預估每小時經驗 (EXP/h):</span>
                    <span id="expPerHour" class="text-base font-mono font-black text-cyan-400">0</span>
                </div>
            </div>

            <button id="resetExpBtn" class="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs rounded-lg transition">🔄 重置經驗值統計</button>
        </section>

    </main>

    <footer class="w-full max-w-md text-center py-2 text-[10px] text-slate-500">
        💡 全新現貨，不用等五十年後的流星雨
    </footer>

    <!-- JS 邏輯 -->
    <script>
        // --- 1. 計時器邏輯 ---
        const TOTAL_TIME = 118;
        let remainingTime = TOTAL_TIME;
        let timerId = null;
        let isRunning = false;
        let audioCtx = null;
        let hasAlertedThisCycle = false;
        let customAudioBuffer = null;

        const timeDisplay = document.getElementById('timeDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const displayCard = document.getElementById('displayCard');
        const startResetBtn = document.getElementById('startReset
