<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleBuff - 祈禱 118s 倒數計時器</title>
    <!-- 引入 Tailwind CSS 打造極簡科技感介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-cyan-500 selection:text-slate-950">

    <!-- 頂部標題 -->
    <header class="w-full max-w-md text-center py-6">
        <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
            ✨ 祈禱 Buff 專屬計時器 ✨
        </h1>
        <p class="text-xs text-slate-400 mt-2">118 秒精準倒數，自訂警報提醒，練功絕不卡 Buff！</p>
    </header>

    <!-- 主要內容卡片 -->
    <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- 大數字倒數計時顯示區 -->
        <div id="displayCard" class="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-center transition-all duration-300">
            <div class="text-xs font-semibold text-slate-400 tracking-wider uppercase mb-1">Buff 剩餘時間</div>
            <div id="timeDisplay" class="text-6xl font-mono font-black text-cyan-400 tracking-tight my-2">
                01:58
            </div>
            <div id="statusBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400">
                尚未開始
            </div>
        </div>

        <!-- 主要控制按鈕 -->
        <div class="grid grid-cols-2 gap-3">
            <button id="startResetBtn" class="col-span-2 py-4 px-6 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-lg transition shadow-lg shadow-emerald-500/20 active:scale-95">
                🚀 開始 / 重新計時 (118s)
            </button>
            <button id="pauseBtn" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">
                ⏸️ 暫停
            </button>
            <button id="stopBtn" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold text-sm transition">
                ⏹️ 重置歸零
            </button>
        </div>

        <!-- 滑桿與警報設定區 -->
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 space-y-4">
            
            <!-- 滑桿：選擇剩幾秒提示 -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-300 font-semibold">🔊 響鈴提示時間</span>
                    <span class="text-xs font-mono bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2 py-0.5 rounded-lg">
                        剩餘 <span id="alertTimeVal" class="font-bold text-sm">15</span> 秒時提醒
                    </span>
                </div>
                <input type="range" id="alertSlider" min="5" max="50" step="1" value="15" class="w-full accent-cyan-500 cursor-pointer">
                <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                    <span>5秒</span>
                    <span>25秒</span>
                    <span>50秒</span>
                </div>
            </div>

            <!-- 自動循環模式開關 -->
            <div class="flex items-center justify-between border-t border-slate-800/80 pt-3">
                <div>
                    <div class="text-sm font-semibold text-slate-300">🔁 自動循環模式</div>
                    <div class="text-[11px] text-slate-500">倒數歸零後自動重新計時 118 秒</div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="autoLoopToggle" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500"></div>
                </label>
            </div>

        </div>

    </main>

    <!-- 頁尾說明 -->
    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        <p>💡 提示：點擊「開始」時請確定已允許網頁播放聲音。</p>
    </footer>

    <!-- 核心邏輯 JavaScript -->
    <script>
        const TOTAL_TIME = 118; // 祈禱標準 118 秒
        let remainingTime = TOTAL_TIME;
        let timerId = null;
        let isRunning = false;
        let audioCtx = null;
        let hasAlertedThisCycle = false;

        // DOM 元素引用
        const timeDisplay = document.getElementById('timeDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const displayCard = document.getElementById('displayCard');
        const startResetBtn = document.getElementById('startResetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const alertSlider = document.getElementById('alertSlider');
        const alertTimeVal = document.getElementById('alertTimeVal');
        const autoLoopToggle = document.getElementById('autoLoopToggle');

        // 滑桿數值即時更新
        alertSlider.addEventListener('input', (e) => {
            alertTimeVal.textContent = e.target.value;
        });

        // 格式化秒數為 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // 初始化 Web Audio API
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 發出警報提示音
        function playBeep(freq = 880, duration = 0.25) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // 發出連續急促警告音
        function playAlertSequence() {
            playBeep(880, 0.15);
            setTimeout(() => playBeep(880, 0.15), 200);
            setTimeout(() => playBeep(1046, 0.3), 400);
        }

        // 更新畫面 UI
        function updateUI() {
            timeDisplay.textContent = formatTime(remainingTime);
            const alertThreshold = parseInt(alertSlider.value, 10);

            if (!isRunning) {
                displayCard.className = "bg-slate-950 border border-slate-800 rounded-2xl p-6 text-center transition-all duration-300";
                timeDisplay.className = "text-6xl font-mono font-black text-slate-500 tracking-tight my-2";
                return;
            }

            // 進入警告時間區間
            if (remainingTime <= alertThreshold && remainingTime > 0) {
                displayCard.className = "bg-rose-950/40 border border-rose-500/50 rounded-2xl p-6 text-center transition-all duration-300 animate-pulse";
                timeDisplay.className = "text-6xl font-mono font-black text-rose-400 tracking-tight my-2";
                statusBadge.textContent = "⚠️ 請準備施放祈禱！";
                statusBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
            } else {
                displayCard.className = "bg-slate-950 border border-cyan-500/30 rounded-2xl p-6 text-center transition-all duration-300";
                timeDisplay.className = "text-6xl font-mono font-black text-cyan-400 tracking-tight my-2";
                statusBadge.textContent = "🟢 Buff 作用中";
                statusBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            }
        }

        // 開始 / 重置計時邏輯
        function startTimer() {
            initAudio();
            clearInterval(timerId);
            
            remainingTime = TOTAL_TIME;
            isRunning = true;
            hasAlertedThisCycle = false;

            updateUI();

            timerId = setInterval(() => {
                remainingTime--;

                const alertThreshold = parseInt(alertSlider.value, 10);

                // 到達設定的剩餘秒數 -> 發出警報
                if (remainingTime === alertThreshold && !hasAlertedThisCycle) {
                    playAlertSequence();
                    hasAlertedThisCycle = true;
                }

                // 時間歸零
                if (remainingTime <= 0) {
                    playAlertSequence();
                    
                    if (autoLoopToggle.checked) {
                        // 自動循環：重新開始 118 秒
                        remainingTime = TOTAL_TIME;
                        hasAlertedThisCycle = false;
                    } else {
                        // 停止計時
                        clearInterval(timerId);
                        isRunning = false;
                        statusBadge.textContent = "🛑 Buff 已結束";
                        statusBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400";
                    }
                }

                updateUI();
            }, 1000);
        }

        // 暫停計時
        pauseBtn.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                statusBadge.textContent = "⏸️ 已暫停";
                statusBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20";
            }
        });

        // 完全重置
        stopBtn.addEventListener('click', () => {
            clearInterval(timerId);
            isRunning = false;
            remainingTime = TOTAL_TIME;
            statusBadge.textContent = "尚未開始";
            statusBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400";
            updateUI();
        });

        // 綁定按鈕點擊事件
        startResetBtn.addEventListener('click', startTimer);

        // 初始化第一次 UI 顯示
        updateUI();
    </script>
</body>
</html>
